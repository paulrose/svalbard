[package]
name = "svalbard"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Adapter-driven database backup CLI"
license = "MIT"
repository = "https://github.com/paulrose/svalbard"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
