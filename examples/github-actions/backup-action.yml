# GitHub Actions example: a daily backup of PostgreSQL to an SSH server with SFTP, with the
# Svalbard Action. Copy it to .github/workflows/ in the repository that holds svalbard.toml (see
# examples/sftp.toml) and the server's line for known_hosts.
#
# Secrets: DB_PASSWORD, the database password. BACKUP_SSH_KEY, an unencrypted private key for the
# SSH server. SVALBARD_TOKEN, read access to the Svalbard releases (see "Private access" in the
# README).
name: Back up the app database

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One backup of this database at a time. A new run waits, and never cancels a running backup.
concurrency:
  group: svalbard-db.example.com-app
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    # More than dump_timeout and upload_timeout together, so that Svalbard's limits act first.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the SSH key
        env:
          SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: (umask 077 && printf '%s\n' "$SSH_KEY" >"$RUNNER_TEMP/ssh-key")
      - name: Back up
        id: backup
        # Pin a commit of paulrose/svalbard that knows the version below.
        uses: paulrose/svalbard/action@<commit> # v0.1.0
        with:
          version: 0.1.0
          config: svalbard.toml
          postgresql: "18"
          token: ${{ secrets.SVALBARD_TOKEN }}
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SVALBARD_DESTINATION_IDENTITY_FILE: ${{ runner.temp }}/ssh-key
          SVALBARD_DESTINATION_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
      - name: Report
        if: always() && steps.backup.outputs.result != ''
        env:
          RESULT: ${{ steps.backup.outputs.result }}
          DATA: ${{ steps.backup.outputs.data }}
          ERROR: ${{ steps.backup.outputs.error }}
        run: |
          echo "Backup $RESULT: ${DATA:-$ERROR}"
