# Svalbard configuration example.
#
# This file holds no secrets. Set the database password in SVALBARD_SOURCE_PASSWORD,
# or point source.password_file at a mounted secret file.
# S3 uses the AWS credential chain, for example AWS_ACCESS_KEY_ID or a web identity token.
#
# Validate it with: svalbard config check --config examples/svalbard.toml

[source]
# postgresql or mysql. The default port is 5432 for PostgreSQL and 3306 for MySQL.
type = "postgresql"
host = "db.example.com"
port = 5432
database = "app"
user = "backup"
# password_file = "/run/secrets/db-password"
# TLS with a verified certificate and host name. Without tls_ca_file, the system trust store.
tls = "verify-full"
# tls_ca_file = "/etc/ssl/certs/db-ca.pem"

[destination]
# s3 or r2. For R2, see examples/r2.toml.
type = "s3"
bucket = "example-backups"
prefix = "app/"
region = "eu-west-1"
# An S3-compatible service instead of AWS.
# endpoint = "https://s3.example.com"
upload_timeout = "1h"

# Defaults. See docs/database-safety.md.
[safety]
lock_timeout = "10s"
contention_timeout = "2s"
dump_timeout = "1h"
max_dump_size = "20GiB"
min_free_space = "2GiB"
