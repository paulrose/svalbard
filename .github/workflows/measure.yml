name: Measure

# The workload measurements of scripts/measure.sh, on demand. GitHub's runners for this
# repository have 2 CPUs, so the servers, the load and the backup share them, and the results
# say so.
on:
  workflow_dispatch:
  # Temporary: one run from the branch of #15, before the workflow is on main.
  push:
    branches: [test/safety-scenarios]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgresql: "15", mysql: "8.4" }
          - { postgresql: "16", mysql: "9.7" }
          - { postgresql: "17", mysql: "8.4" }
          - { postgresql: "18", mysql: "9.7" }
    name: measure (PostgreSQL ${{ matrix.postgresql }}, MySQL ${{ matrix.mysql }})
    env:
      POSTGRESQL: ${{ matrix.postgresql }}
      MYSQL: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner has about 10 GB free for Docker. These preinstalled toolchains free more.
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - run: scripts/measure.sh "$POSTGRESQL" "$MYSQL"
