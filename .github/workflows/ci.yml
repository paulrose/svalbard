name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Every supported server version, in pairs. The test image holds the matching clients.
      matrix:
        include:
          - { postgresql: "15", mysql: "8.4" }
          - { postgresql: "16", mysql: "9.7" }
          - { postgresql: "17", mysql: "8.4" }
          - { postgresql: "18", mysql: "9.7" }
    name: databases (PostgreSQL ${{ matrix.postgresql }}, MySQL ${{ matrix.mysql }})
    env:
      POSTGRESQL: ${{ matrix.postgresql }}
      MYSQL: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-databases.sh "$POSTGRESQL" "$MYSQL"
