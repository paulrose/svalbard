name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  integration:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Every supported server version, in pairs. The test image holds the matching clients.
      matrix:
        include:
          - { postgresql: "15", mysql: "8.4" }
          - { postgresql: "16", mysql: "9.7" }
          - { postgresql: "17", mysql: "8.4" }
          - { postgresql: "18", mysql: "9.7" }
    name: integration (PostgreSQL ${{ matrix.postgresql }}, MySQL ${{ matrix.mysql }})
    env:
      POSTGRESQL: ${{ matrix.postgresql }}
      MYSQL: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-integration.sh "$POSTGRESQL" "$MYSQL"

  # Real Cloudflare R2, in the svalbard-ci bucket. GitHub gives no secrets to pull requests
  # from forks, so they skip this job.
  r2:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-r2.sh
        env:
          SVALBARD_TEST_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          SVALBARD_TEST_R2_BUCKET: ${{ vars.R2_BUCKET }}
          SVALBARD_TEST_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SVALBARD_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # The release archive, built as the release workflow builds it.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The documented CI setup on a fresh runner that builds nothing. The job installs the release archive and the
  # native clients as the README says, backs up PostgreSQL to SFTP and MySQL to S3, restores both
  # with the native tools, and checks a failure, secret redaction and a cancellation by the runner.
  clean-runner:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgresql: "18", mysql: "8.4" }
          - { postgresql: "15", mysql: "9.7" }
    name: clean runner (PostgreSQL ${{ matrix.postgresql }}, MySQL ${{ matrix.mysql }})
    env:
      POSTGRESQL_VERSION: ${{ matrix.postgresql }}
      MYSQL_SERIES: ${{ matrix.mysql }}
      COMPOSE_FILE: tests/docker/compose.yaml:tests/docker/ports.yaml
      # The public keys of the Floci emulator. The setup key `test` skips its IAM checks.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the servers
        run: docker compose up --detach --quiet-pull postgresql mysql floci ssh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Install Svalbard
        working-directory: ${{ runner.temp }}/package
        run: |
          sha256sum --check SHA256SUMS
          tar --extract --gzip --file svalbard-*.tar.gz
          name=$(basename svalbard-*.tar.gz .tar.gz)
          echo "$PWD/$name" >>"$GITHUB_PATH"
      - name: Install pg_dump
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends "postgresql-client-$POSTGRESQL_VERSION"
          echo "/usr/lib/postgresql/$POSTGRESQL_VERSION/bin" >>"$GITHUB_PATH"
      - name: Install mysqldump
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/mysql.asc" \
            https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/mysql.asc" |
            awk -F: '$1 == "pub" { getline; print $10 }')
          if [ "$fingerprint" != BCA43417C3B485DD128EC6D4B7B3B788A8D3785C ]; then
            echo "::error::The MySQL signing key has the fingerprint $fingerprint"
            exit 1
          fi
          gpg --dearmor <"$RUNNER_TEMP/mysql.asc" | sudo tee /etc/apt/keyrings/mysql.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/mysql.gpg] https://repo.mysql.com/apt/ubuntu noble mysql-$MYSQL_SERIES-lts" |
            sudo tee /etc/apt/sources.list.d/mysql.list
          # Otherwise apt replaces the runner's MySQL 8.0 server with Oracle's server.
          sudo apt-get remove --yes mysql-server mysql-server-8.0 mysql-server-core-8.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mysql-community-client
      - run: svalbard --version && pg_dump --version && mysqldump --version
      - name: Prepare the servers
        run: tests/clean-runner/prepare.sh

      # GitHub signals only the entry process of a step when it cancels it, so each backup
      # replaces the shell with `exec`. The outputs go to files for the checks below.
      - name: Back up PostgreSQL to SFTP
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.BACKUP_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_DESTINATION_IDENTITY_FILE: ${{ runner.temp }}/ssh-key
          SVALBARD_DESTINATION_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
        run: >-
          exec svalbard backup --config tests/clean-runner/postgresql-sftp.toml --json
          >"$RUNNER_TEMP/out/postgresql.json" 2>"$RUNNER_TEMP/out/postgresql.err"
      - name: Back up MySQL to S3
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.BACKUP_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
        run: >-
          exec svalbard backup --config tests/clean-runner/mysql-s3.toml --json
          >"$RUNNER_TEMP/out/mysql.json" 2>"$RUNNER_TEMP/out/mysql.err"
      - name: Back up MySQL with a wrong password
        id: wrong
        continue-on-error: true
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.WRONG_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_DESTINATION_PREFIX: wrong/
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
        run: >-
          exec svalbard backup --config tests/clean-runner/mysql-s3.toml --json
          >"$RUNNER_TEMP/out/wrong.json" 2>"$RUNNER_TEMP/out/wrong.err"
      - name: Hold a lock on the PostgreSQL table
        timeout-minutes: 2
        run: |
          docker compose exec --detach postgresql psql --username=postgres --dbname=app \
            --command='BEGIN; LOCK TABLE items IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(600)'
          until [ "$(docker compose exec -T postgresql psql --username=postgres --dbname=app \
            --tuples-only --no-align --command="SELECT count(*) FROM pg_locks
              WHERE relation = 'items'::regclass AND mode = 'AccessExclusiveLock' AND granted")" = 1 ]
          do sleep 1; done
      # The dump waits for the lock until the runner cancels the step after a minute.
      - name: Back up PostgreSQL until the runner cancels the step
        id: cancelled
        timeout-minutes: 1
        continue-on-error: true
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.BACKUP_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_DESTINATION_IDENTITY_FILE: ${{ runner.temp }}/ssh-key
          SVALBARD_DESTINATION_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          SVALBARD_DESTINATION_PREFIX: cancelled/
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
          SVALBARD_SAFETY_LOCK_TIMEOUT: 5min
        run: >-
          exec svalbard backup --config tests/clean-runner/postgresql-sftp.toml --json
          >"$RUNNER_TEMP/out/cancelled.json" 2>"$RUNNER_TEMP/out/cancelled.err"
      - name: Show the outputs
        if: always()
        run: |
          shopt -s nullglob
          for file in "$RUNNER_TEMP"/out/*; do echo "== ${file##*/}"; cat "$file"; done

      - name: Restore the PostgreSQL backup
        working-directory: ${{ runner.temp }}/restore
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/ca.crt
        run: |
          data=$(jq --raw-output .data "$RUNNER_TEMP/out/postgresql.json")
          record=$(jq --raw-output .record "$RUNNER_TEMP/out/postgresql.json")
          sftp -b - -P 2222 -i "$RUNNER_TEMP/ssh-key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            backup@127.0.0.1 <<EOF
          get /srv/backups/$data
          get /srv/backups/$record
          EOF
          dump=${data##*/}
          echo "$(jq --raw-output .sha256 "${record##*/}")  $dump" | sha256sum --check
          createdb --template=template0 app_restored
          pg_restore --exit-on-error --dbname=app_restored "$dump"
          query="SELECT md5(string_agg(id || ':' || name, ',' ORDER BY id)) FROM items"
          original=$(psql --dbname=app --tuples-only --no-align --command="$query")
          restored=$(psql --dbname=app_restored --tuples-only --no-align --command="$query")
          echo "original $original, restored $restored"
          [ "$original" = "$restored" ]
      - name: Restore the MySQL backup
        working-directory: ${{ runner.temp }}/restore
        run: |
          data=$(jq --raw-output .data "$RUNNER_TEMP/out/mysql.json")
          record=$(jq --raw-output .record "$RUNNER_TEMP/out/mysql.json")
          aws --endpoint-url http://127.0.0.1:4566 s3 cp "s3://backups/$data" .
          aws --endpoint-url http://127.0.0.1:4566 s3 cp "s3://backups/$record" .
          dump=${data##*/}
          echo "$(jq --raw-output .sha256 "${record##*/}")  $dump" | sha256sum --check
          (umask 077 && printf '[client]\nhost=127.0.0.1\nuser=root\npassword=mysql\nssl-mode=VERIFY_IDENTITY\nssl-ca=%s\n' \
            "$RUNNER_TEMP/ca.crt" >"$RUNNER_TEMP/mysql.cnf")
          mysql --defaults-extra-file="$RUNNER_TEMP/mysql.cnf" --execute='CREATE DATABASE app_restored'
          mysql --defaults-extra-file="$RUNNER_TEMP/mysql.cnf" app_restored <"$dump"
          checksums=$(mysql --defaults-extra-file="$RUNNER_TEMP/mysql.cnf" --skip-column-names \
            --execute='CHECKSUM TABLE app.items, app_restored.items' | cut -f2)
          echo "$checksums"
          [ "$(echo "$checksums" | sort --unique | wc -l)" = 1 ]
      - name: Check the failure
        env:
          OUTCOME: ${{ steps.wrong.outcome }}
        run: |
          [ "$OUTCOME" = failure ]
          jq --exit-status '.result == "failed" and .stage == "dump" and .error == "preflight"' \
            "$RUNNER_TEMP/out/wrong.json"
          # shellcheck disable=SC2016 # The backticks are JMESPath.
          [ "$(aws --endpoint-url http://127.0.0.1:4566 s3api list-objects-v2 --bucket backups \
            --prefix wrong/ --query 'length(Contents || `[]`)' --output text)" = 0 ]
      - name: Check the cancellation
        env:
          OUTCOME: ${{ steps.cancelled.outcome }}
        run: |
          [ "$OUTCOME" = failure ]
          jq --exit-status '.result == "failed" and .error == "cancelled"' "$RUNNER_TEMP/out/cancelled.json"
          [ "$(docker compose exec -T postgresql psql --username=postgres --tuples-only --no-align \
            --command="SELECT count(*) FROM pg_stat_activity WHERE usename = 'backup'")" = 0 ]
          [ -z "$(docker compose exec -T ssh ls -A /srv/backups/cancelled)" ]
      - name: Check that no output holds a password
        if: always()
        run: |
          if grep --recursive --fixed-strings --files-with-matches \
            --regexp="$BACKUP_PASSWORD" --regexp="$WRONG_PASSWORD" "$RUNNER_TEMP/out"; then
            echo "::error::An output holds a password"
            exit 1
          fi
      - name: Check that no run directory remains
        if: always()
        run: '[ -z "$(ls -A "$RUNNER_TEMP/staging")" ]'

  # The Action of this commit, with a released Svalbard, on a fresh runner. It installs the
  # clients, backs up PostgreSQL to SFTP, and fails on a wrong password and on a cancellation by
  # the runner. The checks read the Action's outputs.
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgresql: "18", mysql: "8.4" }
          - { postgresql: "15", mysql: "9.7" }
    name: action (PostgreSQL ${{ matrix.postgresql }}, MySQL ${{ matrix.mysql }})
    env:
      POSTGRESQL_VERSION: ${{ matrix.postgresql }}
      MYSQL_SERIES: ${{ matrix.mysql }}
      COMPOSE_FILE: tests/docker/compose.yaml:tests/docker/ports.yaml
      # The public keys of the Floci emulator. The setup key `test` skips its IAM checks.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the servers
        run: docker compose up --detach --quiet-pull postgresql mysql floci ssh
      - name: Prepare the servers
        run: tests/clean-runner/prepare.sh
      - name: Back up PostgreSQL to SFTP
        id: backup
        uses: ./action
        with:
          version: 0.1.0
          config: tests/clean-runner/postgresql-sftp.toml
          postgresql: ${{ matrix.postgresql }}
          mysql: ${{ matrix.mysql }}
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.BACKUP_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_DESTINATION_IDENTITY_FILE: ${{ runner.temp }}/ssh-key
          SVALBARD_DESTINATION_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
      - name: Check the backup
        working-directory: ${{ runner.temp }}/restore
        env:
          RESULT: ${{ steps.backup.outputs.result }}
          DATA: ${{ steps.backup.outputs.data }}
          RECORD: ${{ steps.backup.outputs.record }}
          SHA256: ${{ steps.backup.outputs.sha256 }}
        run: |
          [ "$RESULT" = complete ]
          sftp -b - -P 2222 -i "$RUNNER_TEMP/ssh-key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            backup@127.0.0.1 <<EOF
          get /srv/backups/$DATA
          get /srv/backups/$RECORD
          EOF
          [ "$(jq --raw-output .sha256 "${RECORD##*/}")" = "$SHA256" ]
          echo "$SHA256  ${DATA##*/}" | sha256sum --check
      - name: Back up MySQL with a wrong password
        id: wrong
        continue-on-error: true
        uses: ./action
        with:
          version: 0.1.0
          config: tests/clean-runner/mysql-s3.toml
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.WRONG_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_DESTINATION_PREFIX: wrong/
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
      - name: Hold a lock on the PostgreSQL table
        timeout-minutes: 2
        run: |
          docker compose exec --detach postgresql psql --username=postgres --dbname=app \
            --command='BEGIN; LOCK TABLE items IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(600)'
          until [ "$(docker compose exec -T postgresql psql --username=postgres --dbname=app \
            --tuples-only --no-align --command="SELECT count(*) FROM pg_locks
              WHERE relation = 'items'::regclass AND mode = 'AccessExclusiveLock' AND granted")" = 1 ]
          do sleep 1; done
      # The dump waits for the lock until the runner cancels the step after a minute.
      - name: Back up PostgreSQL until the runner cancels the step
        id: cancelled
        timeout-minutes: 1
        continue-on-error: true
        uses: ./action
        with:
          version: 0.1.0
          config: tests/clean-runner/postgresql-sftp.toml
        env:
          SVALBARD_SOURCE_PASSWORD: ${{ env.BACKUP_PASSWORD }}
          SVALBARD_SOURCE_TLS_CA_FILE: ${{ runner.temp }}/ca.crt
          SVALBARD_DESTINATION_IDENTITY_FILE: ${{ runner.temp }}/ssh-key
          SVALBARD_DESTINATION_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          SVALBARD_DESTINATION_PREFIX: cancelled/
          SVALBARD_SAFETY_STAGING_DIR: ${{ runner.temp }}/staging
          SVALBARD_SAFETY_LOCK_TIMEOUT: 5min
      - name: Check the failure and the cancellation
        env:
          WRONG_OUTCOME: ${{ steps.wrong.outcome }}
          WRONG_STAGE: ${{ steps.wrong.outputs.stage }}
          WRONG_ERROR: ${{ steps.wrong.outputs.error }}
          CANCELLED_OUTCOME: ${{ steps.cancelled.outcome }}
          CANCELLED_ERROR: ${{ steps.cancelled.outputs.error }}
        run: |
          echo "wrong: $WRONG_OUTCOME $WRONG_STAGE $WRONG_ERROR; cancelled: $CANCELLED_OUTCOME $CANCELLED_ERROR"
          [ "$WRONG_OUTCOME" = failure ] && [ "$WRONG_STAGE" = dump ] && [ "$WRONG_ERROR" = preflight ]
          [ "$CANCELLED_OUTCOME" = failure ] && [ "$CANCELLED_ERROR" = cancelled ]
          # shellcheck disable=SC2016 # The backticks are JMESPath.
          [ "$(aws --endpoint-url http://127.0.0.1:4566 s3api list-objects-v2 --bucket backups \
            --prefix wrong/ --query 'length(Contents || `[]`)' --output text)" = 0 ]
          [ "$(docker compose exec -T postgresql psql --username=postgres --tuples-only --no-align \
            --command="SELECT count(*) FROM pg_stat_activity WHERE usename = 'backup'")" = 0 ]
          [ -z "$(docker compose exec -T ssh ls -A /srv/backups/cancelled)" ]
      - name: Check that no output holds a password
        if: always()
        env:
          OUTPUTS: ${{ steps.backup.outputs.json }} ${{ steps.wrong.outputs.json }} ${{ steps.cancelled.outputs.json }}
        run: |
          if grep --fixed-strings --regexp="$BACKUP_PASSWORD" --regexp="$WRONG_PASSWORD" <<<"$OUTPUTS"; then
            echo "::error::An output holds a password"
            exit 1
          fi
      - name: Check that no run directory remains
        if: always()
        run: '[ -z "$(ls -A "$RUNNER_TEMP/staging")" ]'
