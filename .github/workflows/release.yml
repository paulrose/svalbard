name: Release

# A tag such as v0.1.0 on main builds the release binary and creates a GitHub release with the
# archive and its SHA-256. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: scripts/package.sh
      - name: Check the tag
        run: |
          version=$(target/release/svalbard --version)
          if [ "$GITHUB_REF_NAME" != "v${version#svalbard }" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version: $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
