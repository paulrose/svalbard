# PostgreSQL and MySQL servers with TLS, the Floci S3 emulator, an OpenSSH server, and the
# test runners.
# scripts/test-integration.sh runs `tests`, and scripts/test-r2.sh runs `r2`.
# The servers publish no ports. Only the runner on the Compose network can reach them.
# Nothing is built, and nothing is written to the host: the scripts remove the containers,
# the volumes and the images that they pulled.
name: svalbard-tests

# The stock MySQL image becomes the runner. See runner.sh.
x-runner: &runner
  image: mysql:${MYSQL_SERIES:-8.4}
  entrypoint: [bash, /svalbard/tests/docker/runner.sh]
  working_dir: /svalbard

services:
  # A test CA and a server certificate for both servers.
  certs:
    image: mysql:${MYSQL_SERIES:-8.4}
    entrypoint: []
    volumes:
      - certs:/certs
    working_dir: /certs
    command:
      - bash
      - -ec
      - |
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=svalbard-test-ca \
          -keyout ca.key -out ca.crt 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj /CN=svalbard-test \
          -keyout server.key -out server.csr 2>/dev/null
        printf 'subjectAltName=DNS:postgresql,DNS:mysql\n' >server.ext
        openssl x509 -req -days 2 -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -extfile server.ext -out server.crt 2>/dev/null
        chmod 644 server.key

  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-18}
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/svalbard
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/postgresql
    # The server needs a key file that its own user owns.
    entrypoint:
      - bash
      - -c
      - install -o postgres -m 600 /certs/server.crt /certs/server.key /tmp/ && exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tmp/server.crt
      - -c
      - ssl_key_file=/tmp/server.key
    healthcheck:
      # The image starts a temporary server without TCP first.
      test: [CMD, pg_isready, --quiet, --host, localhost, --username, postgres]
      interval: 1s
      retries: 120
    depends_on:
      certs:
        condition: service_completed_successfully

  mysql:
    image: mysql:${MYSQL_SERIES:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/mysql
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
      # With GTIDs on, --set-gtid-purged=OFF must keep mysqldump from taking a global read lock.
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      # The image starts a temporary server without TCP first.
      test: [CMD, mysqladmin, ping, --silent, --host=127.0.0.1, --user=root, --password=mysql]
      interval: 1s
      retries: 120
    depends_on:
      certs:
        condition: service_completed_successfully

  floci:
    image: floci/floci:${FLOCI_VERSION:-2.3.0}
    environment:
      # IAM checks make bucket policies apply to the `floci` key that Svalbard uses. The setup
      # key `test` skips them.
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_IAM_SEED_DEPLOYER_PRINCIPAL: "true"
      FLOCI_SERVICES_UI_ENABLED: "false"

  # An OpenSSH server. It writes its host key, the client keys and the known_hosts files to the
  # ssh-keys volume. `backup` has a shell, and `sftponly` can only use SFTP.
  ssh:
    image: alpine:3.24
    volumes:
      - ssh-keys:/keys
    command:
      - sh
      - -ec
      - |
        apk add --quiet --no-progress openssh
        ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/ssh_host_ed25519_key
        cd /keys
        for key in other client stranger; do ssh-keygen -q -t ed25519 -N '' -f $$key; done
        echo "* $$(cat /etc/ssh/ssh_host_ed25519_key.pub)" >known_hosts
        echo "* $$(cat other.pub)" >known_hosts_wrong
        : >known_hosts_empty
        for user in backup sftponly; do
          adduser -D -s /bin/sh $$user
          # Alpine's sshd refuses key logins to locked accounts.
          echo "$$user:*" | chpasswd -e
          install -d -o $$user -m 700 /home/$$user/.ssh
          install -o $$user -m 600 client.pub /home/$$user/.ssh/authorized_keys
        done
        install -d -o backup /srv/backups
        install -d /srv/readonly
        for name in 'with space' "it's" '$$(touch /tmp/pwned)' '*?[x]' 'ünïcode'; do
          install -d -o backup "/srv/backups/$$name"
        done
        cat >>/etc/ssh/sshd_config <<'CONF'
        HostKey /etc/ssh/ssh_host_ed25519_key
        PasswordAuthentication no
        # The tests connect often and in parallel, and some fail on purpose.
        MaxStartups 100
        PerSourcePenalties no
        Match User sftponly
          ForceCommand internal-sftp
        CONF
        exec /usr/sbin/sshd -D -e
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "22"]
      interval: 1s
      retries: 120

  tests:
    <<: *runner
    volumes:
      - ../..:/svalbard:ro
      - certs:/certs:ro
      - ssh-keys:/keys:ro
    environment:
      POSTGRESQL_VERSION: ${POSTGRESQL_VERSION:-18}
      # The build stays in the container.
      CARGO_TARGET_DIR: /target
      SVALBARD_TEST_POSTGRESQL: postgresql://postgres:postgres@postgresql:5432/postgres
      SVALBARD_TEST_POSTGRESQL_CA: /certs/ca.crt
      SVALBARD_TEST_MYSQL: mysql://root:mysql@mysql:3306/mysql
      SVALBARD_TEST_MYSQL_CA: /certs/ca.crt
      SVALBARD_TEST_S3_ENDPOINT: http://floci:4566
      SVALBARD_TEST_SSH_HOST: ssh
      SVALBARD_TEST_SSH_KEYS: /keys
      # The emulator's public test keys.
      AWS_ACCESS_KEY_ID: floci
      AWS_SECRET_ACCESS_KEY: floci
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      floci:
        condition: service_healthy
      ssh:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      mysql:
        condition: service_healthy

  r2:
    <<: *runner
    volumes:
      - ../..:/svalbard:ro
    environment:
      - POSTGRESQL_VERSION=${POSTGRESQL_VERSION:-18}
      - CARGO_TARGET_DIR=/target
      # Names only: the values come from scripts/test-r2.sh, never from arguments.
      - SVALBARD_TEST_R2_ENDPOINT
      - SVALBARD_TEST_R2_BUCKET
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY

volumes:
  certs:
  ssh-keys:
