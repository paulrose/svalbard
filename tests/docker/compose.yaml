# PostgreSQL and MySQL servers with TLS, a PostgreSQL hot standby, a MySQL replica, a MySQL server
# without performance_schema, the Floci S3 emulator, an OpenSSH server, and the test runners.
# scripts/test-integration.sh runs `tests`, and scripts/test-r2.sh runs `r2`.
# The servers publish no ports, so only the runner on the Compose network can reach them.
# ports.yaml publishes them on 127.0.0.1 for the clean-runner CI job.
# Nothing is built, and nothing is written to the host: the scripts remove the containers,
# the volumes and the images that they pulled.
name: svalbard-tests

# The stock MySQL image becomes the runner. See runner.sh.
x-runner: &runner
  image: mysql:${MYSQL_SERIES:-8.4}
  entrypoint: [bash, /svalbard/tests/docker/runner.sh]
  working_dir: /svalbard

services:
  # A test CA and a server certificate for both servers.
  certs:
    image: mysql:${MYSQL_SERIES:-8.4}
    entrypoint: []
    volumes:
      - certs:/certs
    working_dir: /certs
    command:
      - bash
      - -ec
      - |
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=svalbard-test-ca \
          -keyout ca.key -out ca.crt 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj /CN=svalbard-test \
          -keyout server.key -out server.csr 2>/dev/null
        # The tests reach the servers through a local proxy, so 127.0.0.1 is a name too.
        printf 'subjectAltName=DNS:postgresql,DNS:postgresql-standby,DNS:mysql,DNS:mysql-replica,DNS:mysql-nops,DNS:localhost,IP:127.0.0.1\n' >server.ext
        openssl x509 -req -days 2 -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -extfile server.ext -out server.crt 2>/dev/null
        chmod 644 server.key

  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-18}
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/svalbard
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/postgresql
    # The server needs a key file that its own user owns. The standby replicates with the
    # postgres role.
    entrypoint:
      - bash
      - -c
      - |
        install -o postgres -m 600 /certs/server.crt /certs/server.key /tmp/
        echo 'echo "host replication all all scram-sha-256" >>"$$PGDATA/pg_hba.conf"' \
          >/docker-entrypoint-initdb.d/replication.sh
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tmp/server.crt
      - -c
      - ssl_key_file=/tmp/server.key
    healthcheck:
      # The image starts a temporary server without TCP first.
      test: [CMD, pg_isready, --quiet, --host, localhost, --username, postgres]
      interval: 1s
      retries: 120
    depends_on:
      certs:
        condition: service_completed_successfully

  # A hot standby of `postgresql`, copied when it starts.
  postgresql-standby:
    image: postgres:${POSTGRESQL_VERSION:-18}
    environment:
      PGDATA: /var/lib/postgresql/svalbard
      # For pg_basebackup, and for the replication connection that it configures.
      PGPASSWORD: postgres
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint:
      - bash
      - -ec
      - |
        install -o postgres -m 600 /certs/server.crt /certs/server.key /tmp/
        install -d -o postgres -m 700 "$$PGDATA"
        gosu postgres pg_basebackup --host=postgresql --username=postgres --pgdata="$$PGDATA" \
          --write-recovery-conf --wal-method=stream --checkpoint=fast
        exec gosu postgres postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt \
          -c ssl_key_file=/tmp/server.key "$$@"
      - --
    # The tests on the primary change shared catalogs in parallel. Without feedback, replay of
    # their cleanup can wait for the snapshot of a dump on the standby, which no lock shows.
    command: [-c, hot_standby_feedback=on]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ "$$(psql --host=localhost --username=postgres --tuples-only --no-align
          --command="SELECT status FROM pg_stat_wal_receiver")" = streaming ]
      interval: 1s
      retries: 120
    depends_on:
      postgresql:
        condition: service_healthy

  mysql:
    image: mysql:${MYSQL_SERIES:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/mysql
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
      # With GTIDs on, --set-gtid-purged=OFF must keep mysqldump from taking a global read lock.
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      # The image starts a temporary server without TCP first.
      test: [CMD, mysqladmin, ping, --silent, --host=127.0.0.1, --user=root, --password=mysql]
      interval: 1s
      retries: 120
    depends_on:
      certs:
        condition: service_completed_successfully

  # A replica of `mysql`, which replicates everything since the source started.
  mysql-replica:
    image: mysql:${MYSQL_SERIES:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/mysql
    entrypoint:
      - bash
      - -c
      - |
        cat >/docker-entrypoint-initdb.d/replica.sql <<'SQL'
        CHANGE REPLICATION SOURCE TO SOURCE_HOST = 'mysql', SOURCE_USER = 'root',
          SOURCE_PASSWORD = 'mysql', SOURCE_AUTO_POSITION = 1, SOURCE_SSL = 1;
        START REPLICA;
        SQL
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-buffer-pool-size=64M
      - --innodb-redo-log-capacity=8M
    healthcheck:
      # Both replication threads run.
      test:
        - CMD-SHELL
        - >-
          mysql --host=127.0.0.1 --user=root --password=mysql --vertical
          --execute='SHOW REPLICA STATUS' 2>/dev/null | grep -c 'Running: Yes' | grep -qx 2
      interval: 1s
      retries: 120
    depends_on:
      mysql:
        condition: service_healthy

  # A server without performance_schema, so contention detection is unavailable.
  mysql-nops:
    image: mysql:${MYSQL_SERIES:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - certs:/certs:ro
    tmpfs:
      - /var/lib/mysql
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
      - --performance-schema=OFF
      - --skip-log-bin
      - --innodb-buffer-pool-size=64M
      - --innodb-redo-log-capacity=8M
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent, --host=127.0.0.1, --user=root, --password=mysql]
      interval: 1s
      retries: 120
    depends_on:
      certs:
        condition: service_completed_successfully

  floci:
    image: floci/floci:${FLOCI_VERSION:-2.3.0}
    environment:
      # IAM checks make bucket policies apply to the `floci` key that Svalbard uses. The setup
      # key `test` skips them.
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_IAM_SEED_DEPLOYER_PRINCIPAL: "true"
      FLOCI_SERVICES_UI_ENABLED: "false"

  # An OpenSSH server. It writes its host key, the client keys and the known_hosts files to the
  # ssh-keys volume. `backup` has a shell, and `sftponly` can only use SFTP.
  ssh:
    image: alpine:3.24
    volumes:
      - ssh-keys:/keys
    command:
      - sh
      - -ec
      - |
        apk add --quiet --no-progress openssh
        ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/ssh_host_ed25519_key
        cd /keys
        for key in other client stranger; do ssh-keygen -q -t ed25519 -N '' -f $$key; done
        echo "* $$(cat /etc/ssh/ssh_host_ed25519_key.pub)" >known_hosts
        echo "* $$(cat other.pub)" >known_hosts_wrong
        : >known_hosts_empty
        for user in backup sftponly; do
          adduser -D -s /bin/sh $$user
          # Alpine's sshd refuses key logins to locked accounts.
          echo "$$user:*" | chpasswd -e
          install -d -o $$user -m 700 /home/$$user/.ssh
          install -o $$user -m 600 client.pub /home/$$user/.ssh/authorized_keys
        done
        install -d -o backup /srv/backups
        install -d /srv/readonly
        for name in 'with space' "it's" '$$(touch /tmp/pwned)' '*?[x]' 'ünïcode'; do
          install -d -o backup "/srv/backups/$$name"
        done
        cat >>/etc/ssh/sshd_config <<'CONF'
        HostKey /etc/ssh/ssh_host_ed25519_key
        PasswordAuthentication no
        # The tests connect often and in parallel, and some fail on purpose.
        MaxStartups 100
        PerSourcePenalties no
        Match User sftponly
          ForceCommand internal-sftp
        CONF
        exec /usr/sbin/sshd -D -e
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "22"]
      interval: 1s
      retries: 120

  tests:
    <<: *runner
    volumes:
      - ../..:/svalbard:ro
      - certs:/certs:ro
      - ssh-keys:/keys:ro
    # A staging filesystem that a dump fills.
    tmpfs:
      - /staging-small:size=256k
    environment:
      POSTGRESQL_VERSION: ${POSTGRESQL_VERSION:-18}
      # The build stays in the container.
      CARGO_TARGET_DIR: /target
      SVALBARD_TEST_POSTGRESQL: postgresql://postgres:postgres@postgresql:5432/postgres
      SVALBARD_TEST_POSTGRESQL_STANDBY: postgresql://postgres:postgres@postgresql-standby:5432/postgres
      SVALBARD_TEST_POSTGRESQL_CA: /certs/ca.crt
      SVALBARD_TEST_MYSQL: mysql://root:mysql@mysql:3306/mysql
      SVALBARD_TEST_MYSQL_REPLICA: mysql://root:mysql@mysql-replica:3306/mysql
      SVALBARD_TEST_MYSQL_NOPS: mysql://root:mysql@mysql-nops:3306/mysql
      SVALBARD_TEST_MYSQL_CA: /certs/ca.crt
      SVALBARD_TEST_S3_ENDPOINT: http://floci:4566
      SVALBARD_TEST_FLOCI_VERSION: ${FLOCI_VERSION:-2.3.0}
      SVALBARD_TEST_SSH_HOST: ssh
      SVALBARD_TEST_SSH_KEYS: /keys
      # The emulator's public test keys.
      AWS_ACCESS_KEY_ID: floci
      AWS_SECRET_ACCESS_KEY: floci
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      floci:
        condition: service_healthy
      ssh:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      postgresql-standby:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-nops:
        condition: service_healthy

  r2:
    <<: *runner
    volumes:
      - ../..:/svalbard:ro
      - certs:/certs:ro
    environment:
      - POSTGRESQL_VERSION=${POSTGRESQL_VERSION:-18}
      - CARGO_TARGET_DIR=/target
      - SVALBARD_TEST_POSTGRESQL=postgresql://postgres:postgres@postgresql:5432/postgres
      - SVALBARD_TEST_POSTGRESQL_CA=/certs/ca.crt
      - SVALBARD_TEST_MYSQL=mysql://root:mysql@mysql:3306/mysql
      - SVALBARD_TEST_MYSQL_CA=/certs/ca.crt
      # Names only: the values come from scripts/test-r2.sh, never from arguments.
      - SVALBARD_TEST_R2_ENDPOINT
      - SVALBARD_TEST_R2_BUCKET
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    depends_on:
      postgresql:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  certs:
  ssh-keys:
