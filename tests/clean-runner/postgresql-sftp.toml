# The clean-runner CI job: PostgreSQL to SFTP, on the servers that tests/docker/ports.yaml
# publishes. The job sets the password, the CA file, the SSH key, known_hosts and the staging
# directory through environment variables.

[source]
type = "postgresql"
host = "127.0.0.1"
database = "app"
user = "backup"

[destination]
type = "sftp"
host = "127.0.0.1"
port = 2222
user = "backup"
path = "/srv/backups"
prefix = "app/"
